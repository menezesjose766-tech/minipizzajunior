<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada | Mini Pizza Junior</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E0521B">
<link rel="icon" type="image/png" href="/img/logo-128.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{--laranja:#E0521B;--amarelo:#F5A623;--amarelo-claro:#FFD27A;--creme:#FFF6E9;--escuro:#2A1A12;--verde:#25D366}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:var(--creme);font-family:'Nunito',sans-serif;color:var(--escuro);display:flex;flex-direction:column}
  header{padding:18px 20px;display:flex;align-items:center;gap:12px;max-width:1100px;width:100%;margin:0 auto}
  header a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--laranja);font-family:'Bagel Fat One',cursive;font-size:1.3rem;line-height:1}
  header img{width:52px;height:52px}
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 16px 60px}
  .pz{width:min(240px,60vw);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#FFE29A 0 55%,#F2B25C 56% 66%,#D98A3A 67%);position:relative;margin-bottom:28px;box-shadow:0 20px 40px rgba(120,45,10,.18)}
  .pz::after{content:"";position:absolute;inset:0;background:conic-gradient(var(--creme) 0 45deg,transparent 45deg);border-radius:50%}
  .pz span{position:absolute;inset:0;display:grid;place-items:center;font-family:'Bagel Fat One',cursive;font-size:clamp(3rem,14vw,4.6rem);color:var(--laranja);text-shadow:4px 5px 0 var(--amarelo-claro)}
  h1{font-family:'Bagel Fat One',cursive;font-weight:400;color:var(--laranja);font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.05;margin-bottom:12px}
  p{font-size:1.08rem;max-width:460px;margin-bottom:26px;opacity:.85}
  .acts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:99px;font-weight:800;text-decoration:none;font-size:1rem;border:2px solid var(--escuro)}
  .btn-lar{background:var(--laranja);color:#fff;box-shadow:0 5px 0 #B83F10;border-color:transparent}
  .btn-out{background:#fff;color:var(--escuro)}
  nav{margin-top:30px;display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
  nav a{color:var(--escuro);font-weight:800;opacity:.7}
</style>
</head>
<body>
<header><a href="/"><img src="/img/logo-256.webp" alt="Logo Mini Pizza Junior" width="52" height="52">Mini Pizza<br>Junior</a></header>
<main>
  <div class="pz" aria-hidden="true"><span>404</span></div>
  <h1>Ops! Essa fatia sumiu 🍕</h1>
  <p>A página que você procurou não existe ou mudou de lugar. Mas as mini pizzas continuam aqui, quentinhas!</p>
  <div class="acts">
    <a class="btn btn-lar" href="/">Voltar ao início</a>
    <a class="btn btn-out" href="/#sabores">Ver o cardápio</a>
  </div>
  <nav aria-label="Seções do site">
    <a href="/#sabores">Sabores</a><a href="/#revenda">Revenda</a><a href="/#festas">Eventos</a><a href="/#ebook">E-book</a><a href="/#sobre">Sobre nós</a>
  </nav>
</main>
</body>
</html>
